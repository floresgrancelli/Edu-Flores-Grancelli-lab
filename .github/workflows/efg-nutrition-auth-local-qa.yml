name: EFG Nutrition Supabase Auth local JWT/RLS QA (NUT-53; disposable)

on:
  push:
    branches: [work/ncc-pr37-41-qa-snapshot-20261101]
    paths:
      - '.github/workflows/efg-nutrition-auth-local-qa.yml'
      - 'efg-nutrition/tests/persisted-guide-*.mjs'
      - 'efg-nutrition/tests/persisted-coach-*.mjs'
      - 'efg-nutrition/tests/bound-publication-*.mjs'
      - 'efg-nutrition/tests/sql/bound-publication-local-*.sql'
      - 'efg-nutrition/pilot/bound-guide-publication-client.js'
      - 'efg-nutrition/pilot/coach-adapted-workspace.js'
      - 'efg-nutrition/pilot/pilot.js'
      - 'efg-nutrition/tests/sql/persisted-guide-local-overlay.sql'
      - 'efg-nutrition/pilot/persisted-guide-provider.js'
      - 'efg-nutrition/tests/automatic-composition-local.mjs'
      - 'efg-nutrition/tests/sql/automatic-composition-local-overlay.sql'
      - 'efg-nutrition/tests/evidence/fdc-official-20261101.zip'
      - 'efg-nutrition/docs/CLIN_GUT_03_SCOPE_RESPONSE_LOCAL_OPT_IN.sql'
      - 'efg-nutrition/tests/clinical-health-auth-local-e2e.mjs'
  pull_request:
    branches: [efg-nutrition-app, efg-major-integration-20261029]
    paths:
      - '.github/workflows/efg-nutrition-auth-local-qa.yml'
      - 'efg-nutrition/tests/persisted-guide-*.mjs'
      - 'efg-nutrition/tests/sql/persisted-guide-local-overlay.sql'
      - 'efg-nutrition/pilot/persisted-guide-provider.js'
      - '.github/workflows/efg-nutrition-premium-qa.yml'
      - 'efg-nutrition/tests/coach-auth-local-e2e.mjs'
      - 'efg-nutrition/tests/coach119-signed-local-*.mjs'
      - 'efg-nutrition/tests/helpers/coach119-local.mjs'
      - 'efg-nutrition/tests/sql/coach119-signed-current-overlay.sql'
      - 'efg-nutrition/docs/COACH119_HOSTED_ATOMIC_RELEASE_CANDIDATE_NOT_APPLIED.sql'
      - 'efg-nutrition/migrations/20261030_coach*.sql'
      - 'efg-nutrition/migrations/20261031_coach*.sql'
      - 'efg-nutrition/tests/coach-opt-out-rls-auth-local-e2e.mjs'
      - 'efg-nutrition/migrations/20261031_coach_optional_sharing_NOT_APPLIED.sql'
      - 'efg-nutrition/migrations/20261030_coach_relaunch_general_pilot_intake.sql'
      - 'efg-nutrition/tests/coach-pilot-local-jwt-e2e.mjs'
      - 'efg-nutrition/tests/coach-major-release-scope.mjs'
      - 'efg-nutrition/tests/coach69-versioned-auth-local-e2e.mjs'
      - 'efg-nutrition/tests/coach-release-intake-revision.mjs'
      - 'efg-nutrition/pilot/coach-draft-review.js'
      - 'efg-nutrition/pilot/coach-relaunch-onboarding.js'
      - 'efg-nutrition/docs/COACH68_VERSIONED_*_STAGING_ONLY.sql'
      - 'efg-nutrition/docs/COACH_RELAUNCH_REONBOARDING_STAGING_ONLY.sql'
      - 'efg-nutrition/docs/COACH_GO_01_RELEASE_SCOPE_CARLA_POSTGO_RESTORE_20261030.md'
      - 'efg-nutrition/tests/sql/coach-pilot-local-jwt-overlay.sql'
      - 'efg-nutrition/docs/COACH_PILOT_10_EXISTING_STUDENT_PROMOTION_STAGING_ONLY.sql'
      - 'efg-nutrition/tests/coach-local-backup-restore-nut55.mjs'
      - 'efg-nutrition/tests/coach-notification-compat-nut56.mjs'
      - 'efg-nutrition/tests/sql/nut56-*.sql'
      - 'efg-nutrition/docs/NUT56_LEGACY_NOTIFICATION_COMPAT_STAGING_ONLY.sql'
      - 'efg-nutrition/tests/coach-legacy-write-audit-nut55.mjs'
      - 'efg-nutrition/pilot/pilot.js'
      - 'efg-nutrition/pilot/coach-plan-draft-client.js'
      - 'efg-nutrition/tests/sql/coach-auth-local-bootstrap.sql'
      - 'efg-nutrition/docs/LEGAL_VERSIONED_ACCEPTANCE_STAGING_SQL_20261029.sql'
      - 'efg-nutrition/docs/NUT60_PERSONAL_ENROLLMENT_STAGING_ONLY.sql'
      - 'efg-nutrition/docs/NUT60_PERSONAL_JWT_STAGING_REVIEW_20261030.md'
      - 'efg-nutrition/tests/personal-auth-local-e2e.mjs'
      - 'efg-nutrition/docs/COACH_*STAGING_SQL_20261029.sql'
  workflow_dispatch:
    inputs:
      auto_composition:
        description: 'Run reviewed three-food official composition import in disposable Coach119 transaction'
        type: boolean
        default: false
      provider_contract:
        description: 'Run reviewed V5 private health response on empty disposable local stack'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  local-auth-rls:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[provider-contract]') || contains(github.event.head_commit.message, '[auto-composition]') || contains(github.event.head_commit.message, '[persisted-guide]')
    env:
      EFG_QA_AUTO_COMPOSITION: ${{ ((github.event_name == 'workflow_dispatch' && inputs.auto_composition) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[auto-composition]'))) && github.ref == 'refs/heads/work/ncc-pr37-41-qa-snapshot-20261101' && '1' || '0' }}
      EFG_QA_PROVIDER_CONTRACT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.provider_contract) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[provider-contract]'))) && github.ref == 'refs/heads/work/ncc-pr37-41-qa-snapshot-20261101' && '1' || '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit legacy Coach writes before starting containers
        run: node efg-nutrition/tests/coach-legacy-write-audit-nut55.mjs
      - name: 'COACH-GO-01 defend scope: Carla promotion AFTER release, not admin'
        run: node efg-nutrition/tests/coach-major-release-scope.mjs
      - name: Install Supabase CLI (pinned; LOCAL only)
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable local Supabase Auth/PostgREST/Postgres
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efg-nutrition-auth-local"
          cd "$RUNNER_TEMP/efg-nutrition-auth-local"
          supabase init --yes
          # NEVER link or push remote databases. No access token or hosted project ref.
          if [[ -n "$(printenv SUPABASE_ACCESS_TOKEN || true)" || -n "$(printenv SUPABASE_DB_PASSWORD || true)" ]]; then
            echo "Hosted Supabase credentials are prohibited in local QA" >&2
            exit 1
          fi
          if ! supabase start > "$RUNNER_TEMP/supabase-start-private.log" 2>&1; then
            echo "Disposable Supabase startup failed; private startup output is not uploaded."
            exit 1
          fi
          supabase status -o env > "/tmp/efg-nutrition-auth-local-status.env"
          echo "Local Supabase stack available; credentials are ephemeral and not printed."
      - name: Install PostgreSQL client if needed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create disposable Coach schema and server-owned RPCs (NO REMOTE DATABASE)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach-auth-local-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/LEGAL_VERSIONED_ACCEPTANCE_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut56-prodshape-local-overlay.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PLAN_DRAFT_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PUBLICATION_EVIDENCE_POLICY_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/NUT56_LEGACY_NOTIFICATION_COMPAT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PLAN_ATOMIC_PUBLISH_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut56-prodshape-compat-assertions.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: Test real LOCAL signed JWTs and A/B organization authorization
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/coach-auth-local-e2e.mjs
      - name: Backup and restore LOCAL fictional Coach rows with pg_dump/pg_restore
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/coach-local-backup-restore-nut55.mjs
      - name: Check independent legacy notices survive atomic publication
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/coach-notification-compat-nut56.mjs
      - name: COACH-RELAUNCH apply versioned intake ONLY to disposable local database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          # Install exact COACH106 receipt schema in this disposable stack, then
          # test both owner policies and the NOT_APPLIED repair transaction.
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/migrations/20261030_coach_pilot_participation_server_receipts.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_RELAUNCH_REONBOARDING_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/migrations/20261031_coach_relaunch_owner_org_rls_fix_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-RELAUNCH real signed LOCAL JWT, intake version, two orgs, consent and history
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach-relaunch-auth-local-e2e.mjs
          node efg-nutrition/tests/coach-relaunch-auth-local-e2e.mjs
      - name: CLIN-GUT-03 apply private health schema ONLY to disposable local Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/CLIN_GUT_03_PRIVATE_HEALTH_INTAKE_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: V5 scoped health response ONLY on empty disposable clinical tables
        if: env.EFG_QA_PROVIDER_CONTRACT == '1'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/CLIN_GUT_03_SCOPE_RESPONSE_LOCAL_OPT_IN.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: CLIN-GUT-03 signed GoTrue LOCAL JWT health processing and coach sharing
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/clinical-health-auth-local-e2e.mjs
          node efg-nutrition/tests/clinical-health-auth-local-e2e.mjs
      - name: COACH-69 switch ONLY disposable local stack from legacy RPCs to versioned schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach69-disposable-local-version-switch.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH68_VERSIONED_DRAFT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH68_VERSIONED_POLICY_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH68_VERSIONED_ATOMIC_PUBLISH_STAGING_ONLY.sql
          test "$(psql -Atqc "select count(*) from pg_attribute where attrelid='public.efg_coach_plan_drafts'::regclass and attname='source_intake_revision' and not attisdropped")" = '1'
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-69 signed LOCAL JWT A/B versioned Coach draft and atomic guide publish
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach69-versioned-auth-local-e2e.mjs
          node efg-nutrition/tests/coach69-versioned-auth-local-e2e.mjs
      - name: BRAND77B create one-time per-user receipt ONLY on disposable local Supabase
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/BRAND77B_SCIENCE_WELCOME_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: BRAND77B real signed LOCAL JWT student A/B and coach science intro persistence
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/science-welcome-auth-local-e2e.mjs
      - name: NUT-60 apply STRICTLY LOCAL isolated Personal enrollment and goal revision prototype
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/NUT60_PERSONAL_ENROLLMENT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: NUT-60 Authenticated Personal A/B isolated goals (synthetic JWT; no real legal docs)
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/personal-auth-local-e2e.mjs
          node efg-nutrition/tests/personal-auth-local-e2e.mjs
      - name: COACH-PILOT-10 prepare strictly LOCAL disposable role and invitation fixtures
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach-pilot-local-jwt-overlay.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PILOT_10_EXISTING_STUDENT_PROMOTION_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-PILOT-10 signed LOCAL GoTrue JWT and ten-seat promotion test
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach-pilot-local-jwt-e2e.mjs
          node efg-nutrition/tests/coach-pilot-local-jwt-e2e.mjs
      - name: COACH-OPT-03 apply faithful legacy CHECK and opt-out corrective SQL ONLY locally
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          # Install the real status RPC versions in dependency order, only
          # after the previous signed-JWT baseline scenario has completed.
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/migrations/20261030_coach_pilot_student_entry_status.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/migrations/20261030_coach116_legal_first_student_status.sql
          # Reproduce the legacy hosted sharing=true CHECK without validating
          # unrelated synthetic receipts created by the preceding E2E.
          psql -v ON_ERROR_STOP=1 -c "alter table public.efg_pilot_participation_receipts add constraint efg_pilot_participation_receipts_sharing_accepted_check check (sharing_accepted=true) not valid;"
          test "$(psql -Atqc "select count(*) from pg_constraint where conrelid='public.efg_pilot_participation_receipts'::regclass and conname='efg_pilot_participation_receipts_sharing_accepted_check'")" = '1'
          # This corrective migration must remove the legacy CHECK and
          # tighten the Coach SELECT policy; it NEVER runs on hosted Supabase.
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/migrations/20261031_coach_optional_sharing_NOT_APPLIED.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-OPT-03 signed LOCAL JWT immediate opt-out revokes Coach RLS visibility
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach-opt-out-rls-auth-local-e2e.mjs
          node efg-nutrition/tests/coach-opt-out-rls-auth-local-e2e.mjs
      - name: Start a FRESH disposable stack for CURRENT Coach119 integration
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efg-nutrition-auth-local"
          supabase stop --no-backup
          mkdir -p "$RUNNER_TEMP/efg-nutrition-coach119-local"
          cd "$RUNNER_TEMP/efg-nutrition-coach119-local"
          supabase init --yes
          if ! supabase start > "$RUNNER_TEMP/supabase-start-private.log" 2>&1; then
            echo "Disposable Supabase startup failed; private startup output is not uploaded."
            exit 1
          fi
          supabase status -o env > /tmp/efg-nutrition-coach119-local-status.env
      - name: Assemble exact CURRENT Coach candidate modules (fresh LOCAL only)
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-coach119-local-status.env
        run: |
          node --check efg-nutrition/tests/coach119-signed-local-setup.mjs
          node efg-nutrition/tests/coach119-signed-local-setup.mjs
      - name: CURRENT signed JWT full circuit new/returning students and two organizations
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-coach119-local-status.env
        run: |
          node --check efg-nutrition/tests/coach119-signed-local-e2e.mjs
          node efg-nutrition/tests/coach119-signed-local-e2e.mjs
      - name: V10 isolated official three-food composition gates and rollback
        if: env.EFG_QA_AUTO_COMPOSITION == '1'
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-coach119-local-status.env
          EFG_OFFICIAL_FDC_ARCHIVE: efg-nutrition/tests/evidence/fdc-official-20261101.zip
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -f "$EFG_OFFICIAL_FDC_ARCHIVE"
          node --check efg-nutrition/tests/automatic-composition-local.mjs
          node efg-nutrition/tests/automatic-composition-local.mjs 2>&1 | tee "$RUNNER_TEMP/v10-composition-result.txt"
      - name: V10 isolated result log
        if: always() && env.EFG_QA_AUTO_COMPOSITION == '1'
        uses: actions/upload-artifact@v4
        with:
          name: v10-isolated-composition-${{ github.sha }}
          path: ${{ runner.temp }}/v10-composition-result.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Install existing pinned browser QA dependency for persisted UI
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/ncc-pr37-41-qa-snapshot-20261101' && contains(github.event.head_commit.message, '[persisted-guide]') && contains(github.event.head_commit.message, '[persisted-coach-ui]')
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Fresh disposable stack for persisted guide contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/ncc-pr37-41-qa-snapshot-20261101' && contains(github.event.head_commit.message, '[persisted-guide]')
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          cd "$RUNNER_TEMP/efg-nutrition-coach119-local"
          supabase stop --no-backup
          mkdir -p "$RUNNER_TEMP/efg-nutrition-persisted-guide-local"
          cd "$RUNNER_TEMP/efg-nutrition-persisted-guide-local"
          supabase init --yes
          if ! supabase start > "$RUNNER_TEMP/persisted-start-private.log" 2>&1; then
            echo "Disposable start failed; private log not uploaded"; exit 1
          fi
          supabase status -o env > /tmp/efg-nutrition-persisted-guide-local-status.env
      - name: Persisted source-bound guide signed A/B test
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/ncc-pr37-41-qa-snapshot-20261101' && contains(github.event.head_commit.message, '[persisted-guide]')
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-persisted-guide-local-status.env
          EFG_QA_PERSISTED_GUIDE: '1'
          EFG_QA_PERSISTED_UI: ${{ contains(github.event.head_commit.message, '[persisted-coach-ui]') && '1' || '0' }}
          EFG_QA_BOUND_PUBLICATION: ${{ contains(github.event.head_commit.message, '[bound-publication]') && contains(github.event.head_commit.message, '[persisted-coach-ui]') && '1' || '0' }}
        run: |
          set -euo pipefail
          node efg-nutrition/tests/coach119-signed-local-setup.mjs
