name: EFG Nutrition Coach Atomic PostgreSQL QA (ephemeral, synthetic claims)

on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/docs/COACH_*STAGING_SQL_20261029.sql'
      - 'efg-nutrition/docs/COACH_PUBLICATION_EVIDENCE_POSTGRES_QA_20261029.md'
      - 'efg-nutrition/docs/NUT56_LEGACY_NOTIFICATION_COMPAT_STAGING_ONLY.sql'
      - 'efg-nutrition/tests/sql/**'
      - '.github/workflows/efg-nutrition-postgres-staging-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efg_nutrition_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d efg_nutrition_ephemeral"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client present
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Run full schema and real PostgreSQL transaction scenarios (NO SUPABASE)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: efg_nutrition_ephemeral
        run: |
          set -euo pipefail
          # Production is PostgreSQL 17 (Supabase read-only project metadata).
          # Assert the SERVER major, not the potentially different psql client.
          server_num="$(psql -Atqc 'SHOW server_version_num')"
          if ! [[ "$server_num" =~ ^17[0-9]{4}$ ]]; then
            echo "Expected isolated PostgreSQL 17 server; found: $server_num" >&2
            exit 1
          fi
          echo "Ephemeral PostgreSQL 17 verified; all data and claims below are synthetic."
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach-staging-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut56-prodshape-local-overlay.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PLAN_DRAFT_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PUBLICATION_EVIDENCE_POLICY_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/NUT56_LEGACY_NOTIFICATION_COMPAT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PLAN_ATOMIC_PUBLISH_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut56-prodshape-compat-assertions.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach-staging-scenarios.sql
          echo "PASS: ephemeral PostgreSQL 17 syntax and synthetic transaction scenarios."
      - name: NUT-57 real PostgreSQL 17 abort-before-DDL when stage marker is absent (SYNTHETIC)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: efg_nutrition_ephemeral
        run: |
          set -euo pipefail
          # This DB is a disposable synthetic fixture; stage authorization marker
          # is deliberately ABSENT. The preview has NO COMMIT and ends ROLLBACK.
          node efg-nutrition/tests/nut57-staging-bundle.mjs --preview-sql > "$RUNNER_TEMP/nut57-rollback-only.sql"
          if grep -Eiq '^[[:space:]]*COMMIT[[:space:]]*;' "$RUNNER_TEMP/nut57-rollback-only.sql"; then
            echo "NUT57 unsafe: COMMIT detected" >&2
            exit 1
          fi
          before="$(psql -Atqc 'select count(*) from public.efg_goals')"
          if psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/nut57-rollback-only.sql" > "$RUNNER_TEMP/nut57-stage-probe.log" 2>&1; then
            echo "NUT57 unsafe: preview did not reject absent staging marker" >&2
            exit 1
          fi
          if ! grep -q "NUT57 STOP: not an approved isolated staging database" "$RUNNER_TEMP/nut57-stage-probe.log"; then
            echo "NUT57 unexpected failure (not verified safe gate)" >&2
            tail -n 12 "$RUNNER_TEMP/nut57-stage-probe.log" >&2
            exit 1
          fi
          after="$(psql -Atqc 'select count(*) from public.efg_goals')"
          test "$before" = "$after"
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is null")" = "t"
          echo "PASS NUT57 PostgreSQL 17: abort before DDL without isolated staging marker; synthetic goals untouched; preview contains no COMMIT."
      - name: LEG-07 versioned legal backend on separate disposable PostgreSQL 17 database (SYNTHETIC)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: efg_nutrition_ephemeral
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'create database efg_legal_ephemeral'
          export PGDATABASE=efg_legal_ephemeral
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut57-legal-pg17-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/LEGAL_VERSIONED_ACCEPTANCE_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut57-legal-pg17-scenarios.sql
          echo 'PASS LEG-07: separate isolated database, synthetic documents and simulated claim roles; no real consent.'
      - name: State the limits
        if: always()
        run: |
          echo "No production Supabase connection, real JWT, real patient or clinical data."
          echo "The health/legal inputs are SYNTHETIC, not verified evidence."
          echo "A passed test is NOT authorization for migration or deploy."
