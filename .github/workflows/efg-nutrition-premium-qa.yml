      - name: NUT-62 Personal intake to Mifflin preview, exact five-meal split (SYNTHETIC, OFF)
        run: |
          node --check efg-nutrition/pilot/personal-planning-preview.js
          node efg-nutrition/tests/personal-planning-preview.mjs
      - name: Verify serotonin brand loaders, a11y, reduced motion and inactive launch (STATIC ONLY)
        run: node efg-nutrition/tests/serotonin-brand-loading.mjs
      - name: Verify major release messages for every role (offline, NO live delivery)
        run: |
          node --check efg-nutrition/pilot/release-communications.js
          node efg-nutrition/tests/release-communications-draft.mjs
          node efg-nutrition/tests/release-flow.mjs
      - name: Validate expanded nutrition catalog, real portion units, aliases and source transparency
        run: node efg-nutrition/tests/food-catalog-expansion.mjs
      - name: Validate expanded Argentine foods, sushi, pizza and sweets
        run: node efg-nutrition/tests/food-library-expansion.mjs
      - name: Verify 9 regional recipe models and 6 manufacturer nutrition labels
        run: node efg-nutrition/tests/regional-catalog-phase2.mjs
      - name: Check photo labels supplied by user (draft catalog only)
        run: node efg-nutrition/tests/user-photo-labels-20261028.mjs
      - name: Validate phase 3 pastel preview contracts (no live data)
        run: node efg-nutrition/tests/pastel-phase3-preview.mjs
      - name: Check one ±5% weekly track, 6/6 reward and discretionary Sunday
        run: node efg-nutrition/tests/weekly-consistency.mjs
      - name: Verify guided main-meal picker, mixed dishes, skip and unchanged snacks
        run: |
          node --check efg-nutrition/pilot/guided-meal-picker.js
          node efg-nutrition/tests/guided-meal-picker.mjs
      - name: Verify scientific macro engine for men and women
        run: node efg-nutrition/tests/scientific-macros.mjs
      - name: Verify guided five-meal day and baseline
        run: node efg-nutrition/tests/guided-five-meals.mjs
      - name: Verify real-data chart calculations
        run: node efg-nutrition/tests/premium-progress-charts.mjs
      - name: Verify Fit recipes and payment workflow
        run: node efg-nutrition/tests/fit-recipes-payments.mjs
      - name: Verify all 12 photo sources are reachable (HTTP image responses)
        run: node efg-nutrition/tests/fit-photo-live.mjs
      - name: Require real mobile and privacy checks before release
        run: |
          echo "Static gate only: NOT permission to deploy."
          echo "Manual iPhone/Android screenshots and Supabase E2E remain required."

  # Runs the isolated JWT test in an already registered PR workflow.
  # Duplicate until the standalone workflow exists in the production base.
  coach-local-signed-jwt:

    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit legacy Coach writes before starting containers
        run: node efg-nutrition/tests/coach-legacy-write-audit-nut55.mjs
      - name: 'COACH-GO-01 defend scope: Carla promotion AFTER release, not admin'
        run: node efg-nutrition/tests/coach-major-release-scope.mjs
      - name: Install Supabase CLI (pinned; LOCAL only)
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable local Supabase Auth/PostgREST/Postgres
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efg-nutrition-auth-local"
          cd "$RUNNER_TEMP/efg-nutrition-auth-local"
          supabase init --yes
          # NEVER link or push remote databases. No access token or hosted project ref.
          if [[ -n "$(printenv SUPABASE_ACCESS_TOKEN || true)" || -n "$(printenv SUPABASE_DB_PASSWORD || true)" ]]; then
            echo "Hosted Supabase credentials are prohibited in local QA" >&2
            exit 1
          fi
          supabase start
          supabase status -o env > "/tmp/efg-nutrition-auth-local-status.env"
          echo "Local Supabase stack available; credentials are ephemeral and not printed."
      - name: Install PostgreSQL client if needed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create disposable Coach schema and server-owned RPCs (NO REMOTE DATABASE)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach-auth-local-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/LEGAL_VERSIONED_ACCEPTANCE_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut56-prodshape-local-overlay.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PLAN_DRAFT_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PUBLICATION_EVIDENCE_POLICY_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/NUT56_LEGACY_NOTIFICATION_COMPAT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PLAN_ATOMIC_PUBLISH_STAGING_SQL_20261029.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/nut56-prodshape-compat-assertions.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: Test real LOCAL signed JWTs and A/B organization authorization
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/coach-auth-local-e2e.mjs
      - name: Backup and restore LOCAL fictional Coach rows with pg_dump/pg_restore
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/coach-local-backup-restore-nut55.mjs
      - name: Check independent legacy notices survive atomic publication
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: node efg-nutrition/tests/coach-notification-compat-nut56.mjs
      - name: COACH-RELAUNCH apply versioned intake ONLY to disposable local database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_RELAUNCH_REONBOARDING_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-RELAUNCH real signed LOCAL JWT, intake version, two orgs, consent and history
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach-relaunch-auth-local-e2e.mjs
          node efg-nutrition/tests/coach-relaunch-auth-local-e2e.mjs
      - name: CLIN-GUT-03 apply private health schema ONLY to disposable local Postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/CLIN_GUT_03_PRIVATE_HEALTH_INTAKE_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: CLIN-GUT-03 signed GoTrue LOCAL JWT health processing and coach sharing
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/clinical-health-auth-local-e2e.mjs
          node efg-nutrition/tests/clinical-health-auth-local-e2e.mjs
      - name: COACH-69 switch ONLY disposable local stack from legacy RPCs to versioned schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach69-disposable-local-version-switch.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH68_VERSIONED_DRAFT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH68_VERSIONED_POLICY_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH68_VERSIONED_ATOMIC_PUBLISH_STAGING_ONLY.sql
          test "$(psql -Atqc "select count(*) from pg_attribute where attrelid='public.efg_coach_plan_drafts'::regclass and attname='source_intake_revision' and not attisdropped")" = '1'
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-69 signed LOCAL JWT A/B versioned Coach draft and atomic guide publish
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach69-versioned-auth-local-e2e.mjs
          node efg-nutrition/tests/coach69-versioned-auth-local-e2e.mjs
      - name: NUT-60 apply STRICTLY LOCAL isolated Personal enrollment and goal revision prototype
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/NUT60_PERSONAL_ENROLLMENT_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: NUT-60 Authenticated Personal A/B isolated goals (synthetic JWT; no real legal docs)
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/personal-auth-local-e2e.mjs
          node efg-nutrition/tests/personal-auth-local-e2e.mjs
      - name: COACH-PILOT-10 prepare strictly LOCAL disposable role and invitation fixtures
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "${PGHOST}" = '127.0.0.1'
          test "${PGPORT}" = '54322'
          test "${PGDATABASE}" = 'postgres'
          test "$(psql -Atqc "select to_regclass('efg_private.nut57_isolated_staging_marker') is not null")" = 't'
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/tests/sql/coach-pilot-local-jwt-overlay.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/docs/COACH_PILOT_10_EXISTING_STUDENT_PROMOTION_STAGING_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: COACH-PILOT-10 signed LOCAL GoTrue JWT and ten-seat promotion test
        env:
          EFG_LOCAL_STATUS_ENV: /tmp/efg-nutrition-auth-local-status.env
        run: |
          node --check efg-nutrition/tests/coach-pilot-local-jwt-e2e.mjs
          node efg-nutrition/tests/coach-pilot-local-jwt-e2e.mjs
      - name: Stop disposable environment (no backup or remote action)
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1 && [ -d "$RUNNER_TEMP/efg-nutrition-auth-local/supabase" ]; then
            cd "$RUNNER_TEMP/efg-nutrition-auth-local"
            supabase stop --no-backup || true
          fi
      - name: Document limitations
        if: always()
        run: |
          echo "LOCAL GoTrue JWT checks (if completed) do NOT certify hosted Supabase, exact production schema, approved legal text, clinical food evidence, OTP email delivery, production RLS or iOS/Android."
          echo "No production SQL, no new hosted project, no preview branch, no project linking and no deployment. RELEASE NO GO."
