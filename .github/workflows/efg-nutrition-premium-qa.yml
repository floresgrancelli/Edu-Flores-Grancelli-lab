name: EFG Nutrition Premium QA

on:
  push:
    branches: [efg-premium-redesign-dev, efg-recipes-payments-ux, efg-fit-recipe-illustrations, efg-fix-admin-coach-alias, efg-real-recipe-photos-20261027, efg-nutrition-scientific-macros-20261027, efg-security-hardening-20261028]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-premium-qa.yml'
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-premium-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript module syntax
        run: |
          node --check efg-nutrition/pilot/pilot.js
          node --check efg-nutrition/tests/premium-ui-smoke.mjs
          node --check efg-nutrition/pilot/macro-engine.js
          node --check efg-nutrition/pilot/guided-day.js
          node --check efg-nutrition/pilot/food-catalog.js
          node --check efg-nutrition/pilot/food-expansion.js
          node --check efg-nutrition/pilot/food-source-audit.js
          node --check efg-nutrition/pilot/notifications-ui.js
          node --check efg-nutrition/pilot/messages-ui.js
          node --check efg-nutrition/pilot/progress-charts.js
          node --check efg-nutrition/pilot/fit-recipes.js
          node --check efg-nutrition/pilot/fit-recipe-illustrations.js
      - name: CLIN-01 conservative restriction colours, no unsourced green or medical claims (SYNTHETIC)
        run: |
          node --check efg-nutrition/pilot/dietary-traffic-light.js
          node efg-nutrition/tests/dietary-traffic-light-contract.mjs
      - name: Shared food compatibility evidence contracts
        run: node efg-nutrition/tests/food-compatibility.mjs
      - name: Validate role-specific UX contracts
        run: node efg-nutrition/tests/premium-ui-smoke.mjs
      - name: NUT-58 PWA visible manual upgrade, no automatic reload while editing
        run: |
          node --check efg-nutrition/pilot/version-notice.js
          node efg-nutrition/tests/version-notice-opt-in.mjs
      - name: Check Friday, notifications, messages and per-user security contracts
        run: node efg-nutrition/tests/notifications-messages.mjs
      - name: UX Sprint 1 regression (synthetic chat, offline notifications, mobile forms)
        run: node efg-nutrition/tests/ux-sprint1.mjs
      - name: Coach new arrivals role-safe navigation and honest status states
        run: node efg-nutrition/tests/coach-intake-nav.mjs
      - name: Coach voluntary intake and publication gate draft contracts
        run: |
          node --check efg-nutrition/pilot/coach-intake-flow.js
          node efg-nutrition/tests/coach-intake-flow.mjs
      - name: Coach intake to calculator prefill and safe five-meal preview
        run: |
          node --check efg-nutrition/pilot/coach-intake-prefill.js
          node --check efg-nutrition/pilot/pilot.js
          node efg-nutrition/tests/coach-intake-prefill.mjs
      - name: Prevent goals from becoming active before approved Coach guides (synthetic)
        run: |
          node --check efg-nutrition/pilot/coach-goal-write-gate.js
          node efg-nutrition/tests/coach-goal-write-gate.mjs
      - name: Verify OFF-by-default Coach staged draft adapter and anti-bypass (SYNTHETIC)
        run: node efg-nutrition/tests/coach-plan-draft-client.mjs
      - name: NUT-50 complete intake to real calculator to five meals, exact private revision (SYNTHETIC)
        run: |
          node --check efg-nutrition/pilot/coach-draft-review.js
          node efg-nutrition/tests/coach-plan-flow-nut50.mjs
      - name: Verify staging-only Coach drafts SQL contract (NO database connection)
        run: node efg-nutrition/tests/coach-plan-draft-staging-contract.mjs
      - name: Verify staging-only atomic Coach publication contract (NO database connection)
        run: node efg-nutrition/tests/coach-plan-atomic-publish-contract.mjs
      - name: NUT-57 integrated one-transaction STAGING preview, mandatory ROLLBACK (STATIC ONLY)
        run: |
          node --check efg-nutrition/tests/nut57-staging-bundle.mjs
          node --check efg-nutrition/tests/nut57-staging-bundle-contract.mjs
          node efg-nutrition/tests/nut57-staging-bundle-contract.mjs
      - name: Verify server-owned food evidence and legal policy contract (STATIC; NO database)
        run: node efg-nutrition/tests/coach-publication-evidence-policy-contract.mjs
      - name: Verify legal onboarding draft (isolated; NO production legal gate)
        run: |
          node --check efg-nutrition/pilot/legal-onboarding.js
          node efg-nutrition/tests/legal-onboarding-draft.mjs
      - name: NUT-60 Personal read-only and independent role isolation (SYNTHETIC, OFF)
        run: |
          node --check efg-nutrition/pilot/personal-workspace.js
          node efg-nutrition/tests/personal-workspace-readonly.mjs
      - name: NUT-61 Personal intake voluntary health screening (SYNTHETIC; OFF)
        run: |
          node --check efg-nutrition/pilot/personal-intake-draft.js
          node efg-nutrition/tests/personal-intake-draft.mjs
      - name: Verify serotonin brand loaders, a11y, reduced motion and inactive launch (STATIC ONLY)
        run: node efg-nutrition/tests/serotonin-brand-loading.mjs
      - name: Verify major release messages for every role (offline, NO live delivery)
        run: |
          node --check efg-nutrition/pilot/release-communications.js
          node efg-nutrition/tests/release-communications-draft.mjs
          node efg-nutrition/tests/release-flow.mjs
      - name: Validate expanded nutrition catalog, real portion units, aliases and source transparency
        run: node efg-nutrition/tests/food-catalog-expansion.mjs
      - name: Validate expanded Argentine foods, sushi, pizza and sweets
        run: node efg-nutrition/tests/food-library-expansion.mjs
      - name: Verify 9 regional recipe models and 6 manufacturer nutrition labels
        run: node efg-nutrition/tests/regional-catalog-phase2.mjs
      - name: Check photo labels supplied by user (draft catalog only)
        run: node efg-nutrition/tests/user-photo-labels-20261028.mjs
      - name: Validate phase 3 pastel preview contracts (no live data)
        run: node efg-nutrition/tests/pastel-phase3-preview.mjs
      - name: Check one ±5% weekly track, 6/6 reward and discretionary Sunday
        run: node efg-nutrition/tests/weekly-consistency.mjs
      - name: Verify guided main-meal picker, mixed dishes, skip and unchanged snacks
        run: |
          node --check efg-nutrition/pilot/guided-meal-picker.js
          node efg-nutrition/tests/guided-meal-picker.mjs
      - name: Verify scientific macro engine for men and women
        run: node efg-nutrition/tests/scientific-macros.mjs
      - name: Verify guided five-meal day and baseline
        run: node efg-nutrition/tests/guided-five-meals.mjs
      - name: Verify real-data chart calculations
        run: node efg-nutrition/tests/premium-progress-charts.mjs
      - name: Verify Fit recipes and payment workflow
        run: node efg-nutrition/tests/fit-recipes-payments.mjs
      - name: Verify all 12 photo sources are reachable (HTTP image responses)
        run: node efg-nutrition/tests/fit-photo-live.mjs
      - name: Require real mobile and privacy checks before release
        run: |
          echo "Static gate only: NOT permission to deploy."
          echo "Manual iPhone/Android screenshots and Supabase E2E remain required."
