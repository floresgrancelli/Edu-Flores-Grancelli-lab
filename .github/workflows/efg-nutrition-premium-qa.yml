      - name: COACH-67 parse disabled legal bridge (STATIC, NO LEGAL GO)
        run: node --check efg-nutrition/pilot/coach-legal-bridge.js
      - name: COACH-66 relaunch publishes only after version-aware server RPC audit (FAIL CLOSED)
        run: |
