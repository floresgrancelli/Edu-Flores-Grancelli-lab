          node efg-nutrition/tests/coach-release-plan-gate.mjs
      - name: COACH-RELAUNCH pilot student intake version and legal first (DRAFT, OFF)
        run: |
          node --check efg-nutrition/pilot/coach-relaunch-onboarding.js
          node efg-nutrition/tests/coach-relaunch-onboarding.mjs
      - name: COACH-RELAUNCH fresh intake form client and legal-first readback (OFF)
