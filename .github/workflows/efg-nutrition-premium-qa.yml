name: EFG Nutrition Premium QA

on:
  push:
    branches: [efg-premium-redesign-dev, efg-recipes-payments-ux, efg-fit-recipe-illustrations, efg-fix-admin-coach-alias, efg-real-recipe-photos-20261027, efg-nutrition-scientific-macros-20261027, efg-security-hardening-20261028]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-premium-qa.yml'
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-premium-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript module syntax
        run: |
          node --check efg-nutrition/pilot/pilot.js
          node --check efg-nutrition/tests/premium-ui-smoke.mjs
          node --check efg-nutrition/pilot/macro-engine.js
          node --check efg-nutrition/pilot/guided-day.js
          node --check efg-nutrition/pilot/food-catalog.js
          node --check efg-nutrition/pilot/food-expansion.js
          node --check efg-nutrition/pilot/food-source-audit.js
          node --check efg-nutrition/pilot/notifications-ui.js
          node --check efg-nutrition/pilot/messages-ui.js
          node --check efg-nutrition/pilot/progress-charts.js
          node --check efg-nutrition/pilot/fit-recipes.js
          node --check efg-nutrition/pilot/fit-recipe-illustrations.js
      - name: CLIN-01 conservative restriction colours, no unsourced green or medical claims (SYNTHETIC)
        run: |
          node --check efg-nutrition/pilot/dietary-traffic-light.js
          node efg-nutrition/tests/dietary-traffic-light-contract.mjs
          node --check efg-nutrition/pilot/gut-clinical-workbench.js
          node efg-nutrition/tests/gut-clinical-workbench.mjs
      - name: Shared food compatibility evidence contracts
        run: node efg-nutrition/tests/food-compatibility.mjs
      - name: Validate role-specific UX contracts
        run: node efg-nutrition/tests/premium-ui-smoke.mjs
      - name: NUT-58 PWA visible manual upgrade, no automatic reload while editing
        run: |
          node --check efg-nutrition/pilot/version-notice.js
          node efg-nutrition/tests/version-notice-opt-in.mjs
      - name: REPORT-LUX weekly student view, editable draft, history, no automatic clinical or reward claims (SYNTHETIC)
        run: |
          node --check efg-nutrition/pilot/weekly-luxury-report.js
          node --check efg-nutrition/pilot/pilot.js
          node efg-nutrition/tests/weekly-luxury-report.mjs
          node efg-nutrition/tests/coach-pilot-10-and-human-report.mjs
          node efg-nutrition/tests/weekly-report-reply-to-coach.mjs
          node efg-nutrition/tests/weekly-luxury-integration-contract.mjs
      - name: Check Friday, notifications, messages and per-user security contracts
        run: node efg-nutrition/tests/notifications-messages.mjs
      - name: UX Sprint 1 regression (synthetic chat, offline notifications, mobile forms)
        run: node efg-nutrition/tests/ux-sprint1.mjs
      - name: Coach new arrivals role-safe navigation and honest status states
        run: node efg-nutrition/tests/coach-intake-nav.mjs
      - name: Coach voluntary intake and publication gate draft contracts
        run: |
          node --check efg-nutrition/pilot/coach-intake-flow.js
          node efg-nutrition/tests/coach-intake-flow.mjs
      - name: SEC08 hosted-readonly privilege inventory and mandatory release gate remain protected
        run: |
          node --check efg-nutrition/tests/sec08-live-security-contract.mjs
          node efg-nutrition/tests/sec08-live-security-contract.mjs
      - name: COACH-68 versioned intake revision on all draft/policy/publish SQL (STATIC ONLY)
