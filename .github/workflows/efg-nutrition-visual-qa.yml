name: EFG Nutrition Visual QA (isolated fixture)

on:
  push:
    branches: [efg-premium-redesign-dev, efg-recipes-payments-ux, efg-fit-recipe-illustrations, efg-fix-admin-coach-alias, efg-real-recipe-photos-20261027, efg-nutrition-scientific-macros-20261027, efg-security-hardening-20261028]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-visual-qa.yml'
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual UI with mock profiles only (no production connectivity)
        run: |
          node efg-nutrition/tests/scientific-macros.mjs
          node efg-nutrition/tests/guided-five-meals.mjs
          node efg-nutrition/tests/premium-progress-charts.mjs
          node efg-nutrition/tests/fit-recipes-payments.mjs
          node efg-nutrition/tests/premium-visual-smoke.mjs
      - name: BRAND77B illustrated intro + vertical library Chromium, Android and desktop (synthetic)
        run: node efg-nutrition/tests/science-welcome-visual-qa.mjs
      - name: EDUCATION-02 science screen responsive Chromium and Android (synthetic, no production)
        run: |
          node efg-nutrition/tests/nutrition-science-visual-qa.mjs
          EFG_QA_ANDROID=1 node efg-nutrition/tests/nutrition-science-visual-qa.mjs
      - name: COACH101 semaforo labels and vetted-source badges Chromium, iPhone/Pixel/desktop (synthetic)
        run: node efg-nutrition/tests/coach101-semaforo-visual-qa.mjs
      - name: Capture isolated special launch illustration in Chromium (no production data)
        run: node efg-nutrition/tests/release-visual-qa.mjs
      - name: NUT-63 Personal dashboard responsive visual fixture (Chromium, OFF)
        run: node efg-nutrition/tests/personal-visual-qa.mjs
      - name: COACH-RELAUNCH legal-first new intake responsive (Chromium, synthetic OFF)
        run: node efg-nutrition/tests/coach-relaunch-visual-qa.mjs
      - name: REPORT-LUX student report responsive Luxury Pro (Chromium, synthetic)
        run: node efg-nutrition/tests/weekly-luxury-visual-qa.mjs
      - name: ANDROID-QA Pixel 7 full app student coach admin with touch and food search (Chromium emulation; synthetic)
        run: EFG_QA_ANDROID=1 node efg-nutrition/tests/premium-visual-smoke.mjs
      - name: ANDROID-QA Pixel 7 + Galaxy S9+ Luxury Pro report and tap-to-reply (Chromium emulation; synthetic)
        run: EFG_QA_ANDROID=1 node efg-nutrition/tests/weekly-luxury-visual-qa.mjs
      - name: ANDROID Pixel and Galaxy Chrome touch targets, report and reply CTA (synthetic)
        run: node efg-nutrition/tests/weekly-luxury-android-qa.mjs
      - name: CLIN-GUT-02 lactose + SIBO options in responsive intake (SYNTHETIC, collection OFF)
        run: node efg-nutrition/tests/gut-clinical-visual-qa.mjs
      - name: Install Safari-engine WebKit for mobile compatibility
        run: npx playwright install --with-deps webkit
      - name: Check Safari-engine responsive UI (isolated role fixtures)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/premium-visual-smoke.mjs
      - name: BRAND77B illustrated intro Safari/WebKit and vertical library (synthetic)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/science-welcome-visual-qa.mjs
      - name: EDUCATION-02 science screen Safari/WebKit responsive (synthetic)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/nutrition-science-visual-qa.mjs
      - name: COACH101 semaforo in mobile Safari/WebKit (synthetic)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/coach101-semaforo-visual-qa.mjs
      - name: Capture isolated special launch illustration in WebKit (no production data)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/release-visual-qa.mjs
      - name: NUT-63 Personal dashboard responsive visual fixture (WebKit, OFF)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/personal-visual-qa.mjs
      - name: COACH-RELAUNCH legal-first new intake responsive (WebKit, synthetic OFF)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/coach-relaunch-visual-qa.mjs
      - name: REPORT-LUX student report responsive Luxury Pro (WebKit, synthetic)
        run: EFG_QA_ENGINE=webkit node efg-nutrition/tests/weekly-luxury-visual-qa.mjs
      - name: Preserve screenshots and machine-readable layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efg-nutrition-premium-visual-qa
          path: artifacts/premium-visual-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm release remains manual
        run: echo "This test does not publish to Render, Supabase or main."
