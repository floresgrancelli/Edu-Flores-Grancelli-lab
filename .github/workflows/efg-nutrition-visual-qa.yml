name: EFG Nutrition Visual QA (isolated fixture)

on:
  push:
    branches: [efg-premium-redesign-dev, efg-recipes-payments-ux, efg-fit-recipe-illustrations, efg-fix-admin-coach-alias, efg-real-recipe-photos-20261027]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/efg-nutrition-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual UI with mock profiles only (no production connectivity)
        run: |
          node efg-nutrition/tests/premium-progress-charts.mjs
          node efg-nutrition/tests/fit-recipes-payments.mjs
          node efg-nutrition/tests/premium-visual-smoke.mjs
      - name: Preserve screenshots and machine-readable layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efg-nutrition-premium-visual-qa
          path: artifacts/premium-visual-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm release remains manual
        run: echo "This test does not publish to Render, Supabase or main."
