name: NCC Android build
on:
  pull_request:
    paths:
      - 'efg-nutrition/android/**'
      - 'efg-nutrition/ios/**'
      - '.github/workflows/ncc-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate association generator
        run: python3 -m unittest discover -s efg-nutrition/android/tests
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build test APK and unsigned AAB
        working-directory: efg-nutrition/android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ncc-android-test-not-for-production
          path: |
            efg-nutrition/android/app/build/outputs/apk/debug/*.apk
            efg-nutrition/android/app/build/outputs/bundle/release/*.aab
            efg-nutrition/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ncc-android-test-not-for-production
          path: efg-nutrition/android/app/build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open installed app on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: efg-nutrition/android
          script: python3 scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-android-emulator-evidence
          path: efg-nutrition/android/smoke-evidence
          if-no-files-found: warn
          retention-days: 14


  ios-reader-typecheck:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Type-check the HealthKit reader with the iOS SDK
        run: xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios17.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" efg-nutrition/ios/DailyHealthActivityReader.swift efg-nutrition/ios/ActivityConnectionView.swift
