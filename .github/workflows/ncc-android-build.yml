name: NCC Android build
on:
  pull_request:
    paths:
      - 'efg-nutrition/android/**'
      - 'efg-nutrition/pilot/account-deletion*'
      - 'efg-nutrition/pilot/eliminar-cuenta.html'
      - '.github/workflows/ncc-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate association generator
        run: python3 -m unittest discover -s efg-nutrition/android/tests
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build test APK and unsigned AAB
        working-directory: efg-nutrition/android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ncc-android-test-not-for-production
          path: |
            efg-nutrition/android/app/build/outputs/apk/debug/*.apk
            efg-nutrition/android/app/build/outputs/bundle/release/*.aab
            efg-nutrition/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14


  deletion-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-qa-only
          POSTGRES_DB: ncc_deletion_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-qa-only
      PGDATABASE: ncc_deletion_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deletion client
        run: node --test efg-nutrition/android/tests/test-deletion-client.mjs
      - name: Test isolated request database and RLS
        run: |
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/android/tests/deletion-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/android/backend/account-deletion-schema.sql
          psql -v ON_ERROR_STOP=1 -f efg-nutrition/android/tests/deletion-rls.sql

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ncc-android-test-not-for-production
          path: efg-nutrition/android/app/build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open installed app on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: efg-nutrition/android
          script: python3 scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-android-emulator-evidence
          path: efg-nutrition/android/smoke-evidence
          if-no-files-found: warn
          retention-days: 14

  privacy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Preview privacy flow with synthetic accounts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ncc-privacy-http.log 2>&1 &
          node efg-nutrition/android/tests/privacy-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-privacy-preview
          path: efg-nutrition/android/evidence
          if-no-files-found: warn
          retention-days: 14
