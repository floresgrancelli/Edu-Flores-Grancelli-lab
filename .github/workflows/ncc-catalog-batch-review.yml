name: NCC catalog batch review
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths: ['efg-nutrition/**', '.github/workflows/ncc-catalog-batch-review.yml']
permissions:
  contents: read
jobs:
  catalog-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify exact official USDA source archive
        run: |
          curl --fail --location --retry 2 'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_json_2018-04.zip' -o /tmp/usda-srlegacy.zip
          python efg-nutrition/tests/verify-catalog-batch-source.py --archive /tmp/usda-srlegacy.zip
          python efg-nutrition/tests/verify-catalog-batch-two-source.py --archive /tmp/usda-srlegacy.zip
      - run: node efg-nutrition/tests/catalog-batch-20261113.test.mjs
      - run: node efg-nutrition/tests/catalog-batch-two-20261113.test.mjs
      - run: node efg-nutrition/tests/catalog-batch-review-browser.mjs
      - run: node efg-nutrition/tests/catalog-batch-two-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-batch-review
          path: artifacts/catalog-batch-review/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-batch-two-review
          path: artifacts/catalog-batch-two-review/
          if-no-files-found: error
          retention-days: 7
  catalog-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_qa_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_qa_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable test client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - run: node efg-nutrition/tests/catalog-batch-postgres17.mjs
      - name: Reset disposable test database between catalog histories
        run: psql -v ON_ERROR_STOP=1 -c "drop schema efg_private cascade; drop role anon; drop role authenticated;"
      - run: node efg-nutrition/tests/catalog-batch-two-postgres17.mjs
