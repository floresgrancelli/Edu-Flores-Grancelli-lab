name: NCC colour system preview
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/ncc-color-system-preview.yml'
permissions:
  contents: read
jobs:
  colour-system:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/chat-and-inbox-session-regression.mjs
      - run: node efg-nutrition/tests/color-system-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-system-preview
          path: artifacts/color-system/
          if-no-files-found: error
          retention-days: 7
