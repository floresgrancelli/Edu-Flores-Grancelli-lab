name: NCC day tools visual preview
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/ncc-day-tools-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/plan-tabs-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-tabs-review
          path: artifacts/plan-tabs-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/food-family-photos.mjs
      - run: node efg-nutrition/tests/food-photo-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-photo-review
          path: artifacts/food-photo-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/personal-space-review-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: personal-space-review
          path: artifacts/personal-space-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/payments-review-browser.mjs
      - run: node efg-nutrition/tests/progress-review-browser.mjs
      - run: node efg-nutrition/tests/notification-destinations.mjs
      - run: node efg-nutrition/tests/notification-inbox-browser.mjs
      - run: node efg-nutrition/tests/day-tools-preview-browser.mjs
      - run: node efg-nutrition/tests/daily-tips-all-roles-browser.mjs
      - run: node efg-nutrition/tests/science-library-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-tools-preview
          path: |
            artifacts/day-tools-preview/
            artifacts/daily-tips/
            artifacts/science-library/
            artifacts/notification-inbox/
            artifacts/progress-review/
            artifacts/payments-review/
            artifacts/personal-space-review/
          if-no-files-found: error
          retention-days: 7
