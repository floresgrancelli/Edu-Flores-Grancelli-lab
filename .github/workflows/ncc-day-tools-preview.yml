name: NCC day tools visual preview
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/ncc-day-tools-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Fetch reviewed visual comparison baselines
        run: git -c safe.directory="$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin f4260c2266178d6d90a9a1305788f552f521a561 6f36413ad1d790c86b80e80bcbbdcf01d528ae42 0f353af985a85b14cc87229c676ff30eed430315 4150b4f68ea02627b5b361f70320af6a561fdd9c b019913f7c9135451993c6a7368409eff91d3973 aa90d3c8e6bec2fc01b0ead38f207578fc454dd6 e4aa8ad6eb1f11917fddba7cacfc26ca9a64d9db
      - run: node efg-nutrition/tests/mobile-forms-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-forms-review
          path: artifacts/mobile-forms-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/coach-student-actions-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coach-student-actions-review
          path: artifacts/coach-student-actions-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/habitual-recent-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habitual-recent-review
          path: artifacts/habitual-recent-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/food-entry-batch-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-entry-batch-review
          path: artifacts/food-entry-batch-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/save-feedback-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-feedback-review
          path: artifacts/save-feedback-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/notice-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-review
          path: artifacts/notice-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/plan-tabs-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-tabs-review
          path: artifacts/plan-tabs-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/food-family-photos.mjs
      - run: node efg-nutrition/tests/food-photo-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-photo-review
          path: artifacts/food-photo-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/personal-space-review-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: personal-space-review
          path: artifacts/personal-space-review/
          if-no-files-found: error
          retention-days: 7
      - run: node efg-nutrition/tests/payments-review-browser.mjs
      - run: node efg-nutrition/tests/progress-review-browser.mjs
      - run: node efg-nutrition/tests/notification-destinations.mjs
      - run: node efg-nutrition/tests/notification-inbox-browser.mjs
      - run: node efg-nutrition/tests/day-tools-preview-browser.mjs
      - run: node efg-nutrition/tests/daily-tips-all-roles-browser.mjs
      - run: node efg-nutrition/tests/science-library-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-tools-preview
          path: |
            artifacts/day-tools-preview/
            artifacts/daily-tips/
            artifacts/science-library/
            artifacts/notification-inbox/
            artifacts/progress-review/
            artifacts/payments-review/
            artifacts/personal-space-review/
          if-no-files-found: error
          retention-days: 7
