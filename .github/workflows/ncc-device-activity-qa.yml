name: NCC device activity database QA
on:
  pull_request:
    paths:
      - 'efg-nutrition/activity-sync/**'
      - 'efg-nutrition/pilot/device-activity-sync.js'
      - '.github/workflows/ncc-device-activity-qa.yml'
permissions:
  contents: read
jobs:
  activity-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-qa-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-qa-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f fixture.sql -f daily-device-activity.candidate.sql -f test.sql
        working-directory: efg-nutrition/activity-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test efg-nutrition/activity-sync/device-activity.test.mjs
