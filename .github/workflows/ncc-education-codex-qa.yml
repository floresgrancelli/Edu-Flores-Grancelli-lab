name: NCC Educational Codex Harness (combined snapshot)
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/qa-educational-codex/**'
      - '.github/workflows/ncc-education-codex-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-codex-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned release source (read only)
        uses: actions/checkout@v4
        with:
          ref: ca2084de6be319cd1d96c76a712e009bdd138581
          path: source-combined
          persist-credentials: false
      - name: Checkout isolated QA scripts (no app overwrite)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-scripts
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        working-directory: source-combined
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium and WebKit
        working-directory: source-combined
        run: npx playwright install --with-deps chromium webkit
      - name: Combined Codex delta — Chromium
        env:
          EFG_QA_PROJECT_ROOT: ${{ github.workspace }}/source-combined/efg-nutrition
          EFG_QA_OUT: ${{ github.workspace }}/qa-scripts/artifacts/education-delta
          EFG_QA_ENGINE: chromium
        run: |
          mkdir -p qa-scripts/efg-nutrition/qa-educational-codex/combo
          cp qa-scripts/efg-nutrition/qa-educational-codex/source-lock-combined.json qa-scripts/efg-nutrition/qa-educational-codex/combo/source-lock.json
          sed 's/578b3887a39282a41d85a3309ee48cd8e2e3ed45/ca2084de6be319cd1d96c76a712e009bdd138581/g' qa-scripts/efg-nutrition/qa-educational-codex/education-interaction-delta-qa.mjs > qa-scripts/efg-nutrition/qa-educational-codex/combo/education-interaction-delta-qa.mjs
          node --check qa-scripts/efg-nutrition/qa-educational-codex/combo/education-interaction-delta-qa.mjs
          node qa-scripts/efg-nutrition/qa-educational-codex/combo/education-interaction-delta-qa.mjs
      - name: Combined Codex delta — WebKit
        env:
          EFG_QA_PROJECT_ROOT: ${{ github.workspace }}/source-combined/efg-nutrition
          EFG_QA_OUT: ${{ github.workspace }}/qa-scripts/artifacts/education-delta
          EFG_QA_ENGINE: webkit
        run: node qa-scripts/efg-nutrition/qa-educational-codex/combo/education-interaction-delta-qa.mjs
      - name: Preserve QA screenshots + JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncc-codex-education-combined-ca2084
          path: qa-scripts/artifacts/education-delta/
          if-no-files-found: warn
          retention-days: 14
