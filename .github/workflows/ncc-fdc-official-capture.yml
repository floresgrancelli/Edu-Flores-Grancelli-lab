name: NCC official FDC SR Legacy capture (QA only)

on:
  push:
    branches: [work/ncc-pr37-41-qa-snapshot-20261101]
    paths:
      - '.github/workflows/ncc-fdc-official-capture.yml'
      - 'efg-nutrition/tools/capture-usda-fdc-srlegacy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fdc-official-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact USDA archive and generate UNREVIEWED evidence
        run: |
          python -m py_compile efg-nutrition/tools/capture-usda-fdc-srlegacy.py
          python efg-nutrition/tools/capture-usda-fdc-srlegacy.py --output "$RUNNER_TEMP/ncc-fdc-srlegacy-evidence.zip"
      - name: Preserve official-source review package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ncc-fdc-official-unreviewed-${{ github.sha }}
          path: ${{ runner.temp }}/ncc-fdc-srlegacy-evidence.zip
          if-no-files-found: error
          retention-days: 7
