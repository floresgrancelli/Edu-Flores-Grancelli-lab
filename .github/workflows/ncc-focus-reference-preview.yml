name: NCC Focus reference screenshots for owner review
on:
  push:
    branches: [work/ncc-focus-reference-review-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix efg-nutrition/tests/professional-browser-api
      - run: mkdir -p /workspace
      - run: node efg-nutrition/tests/focus-reference-preview.mjs
        env:
          NCC_PLAYWRIGHT_MODULE: ./professional-browser-api/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-reference-review
          path: artifacts/focus-reference-review/
