name: NCC intake cards review
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/ncc-intake-cards-review.yml'
permissions:
  contents: read
jobs:
  intake-cards:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/intake-cards-review-browser.mjs
      - run: node efg-nutrition/tests/intake-routine-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-routine-review
          path: artifacts/intake-routine-review/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-cards-review
          path: artifacts/intake-cards-review/
          if-no-files-found: error
          retention-days: 7
