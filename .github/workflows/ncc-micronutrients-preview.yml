name: NCC micronutrients preview
on:
  push:
    branches: [work/ncc-android-play-prep-20261113]
    paths:
      - 'efg-nutrition/pilot/micronutrient*'
      - 'efg-nutrition/pilot/pilot.js'
      - 'efg-nutrition/tests/micronutrients*'
      - 'efg-nutrition/tools/build-micronutrient-catalog.py'
      - '.github/workflows/ncc-micronutrients-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test efg-nutrition/tests/micronutrients.test.mjs
      - run: cp efg-nutrition/pilot/micronutrient-catalog.js /tmp/micronutrient-catalog-before.js
      - run: python3 efg-nutrition/tools/build-micronutrient-catalog.py
      - run: cmp /tmp/micronutrient-catalog-before.js efg-nutrition/pilot/micronutrient-catalog.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: mkdir -p /workspace
      - run: node efg-nutrition/tests/micronutrients-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micronutrients-preview
          path: artifacts/micronutrients-preview/
