name: NCC notification read-all QA
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/pilot/notifications-ui.*'
      - 'efg-nutrition/tests/notification-read-all-browser.mjs'
      - '.github/workflows/ncc-notification-read-all-qa.yml'
permissions:
  contents: read
jobs:
  read-all:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/notification-read-all-browser.mjs
        env:
          NCC_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-read-all-${{ matrix.browser }}
          path: artifacts/notification-read-all/
