name: NCC prefill and stylesheet review
on:
  push:
    branches: [work/ncc-intake-prefill-assets-20261113]
    paths: ['efg-nutrition/**', '.github/workflows/ncc-prefill-assets-review.yml']
permissions:
  contents: read
jobs:
  prefill-assets:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/prefill-assets-contract.mjs
      - run: node efg-nutrition/tests/prefill-assets-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefill-assets-review
          path: artifacts/prefill-assets-review/
          if-no-files-found: error
          retention-days: 7
