name: NCC readable text QA
on:
  push:
    branches: [work/ncc-readable-text-20261115]
  pull_request:
    branches: [efg-nutrition-app]
    paths: ['efg-nutrition/pilot/readable-text.js', 'efg-nutrition/tests/readable-text-browser.mjs', '.github/workflows/ncc-readable-text-qa.yml']
permissions:
  contents: read
jobs:
  readable-text:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/readable-text-browser.mjs
      - run: node efg-nutrition/tests/settings-preview-browser.mjs
        env:
          NCC_TEXT_SIZE: extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-text-review
          path: artifacts/readable-text/
          retention-days: 7
