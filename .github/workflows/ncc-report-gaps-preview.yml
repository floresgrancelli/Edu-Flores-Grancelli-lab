name: NCC report macro differences preview
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/**'
      - '.github/workflows/ncc-report-gaps-preview.yml'
permissions:
  contents: read
jobs:
  report-gaps:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/report-macro-gaps.mjs
      - run: node efg-nutrition/tests/report-macro-gaps-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-macro-gaps-preview
          path: artifacts/report-macro-gaps/
          if-no-files-found: error
          retention-days: 7
