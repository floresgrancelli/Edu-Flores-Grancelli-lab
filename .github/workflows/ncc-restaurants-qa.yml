name: NCC restaurants QA
on:
  pull_request:
    branches: [efg-nutrition-app]
    paths:
      - 'efg-nutrition/pilot/food-restaurants-20261114.js'
      - 'efg-nutrition/tests/restaurants-browser.mjs'
      - '.github/workflows/ncc-restaurants-qa.yml'
permissions:
  contents: read
jobs:
  restaurants:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node efg-nutrition/tests/restaurants-catalog.mjs
      - run: node efg-nutrition/tests/restaurants-browser.mjs
        env:
          NCC_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurants-${{ matrix.browser }}
          path: artifacts/restaurants/
