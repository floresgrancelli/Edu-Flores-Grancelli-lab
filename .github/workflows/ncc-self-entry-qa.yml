name: NCC self entry and access QA
on:
  push:
    branches: [work/ncc-self-entry-20261113]
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test efg-nutrition/tests/self-management-entry.test.mjs efg-nutrition/tests/self-management-api.test.mjs
      - name: Install isolated browser tools
        run: |
          mkdir -p /tmp/ncc-entry-sdk
          npm install --prefix /tmp/ncc-entry-sdk --save-exact playwright@1.62.1
          node /tmp/ncc-entry-sdk/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Chromium and WebKit at 390 and 320 px
        env:
          NCC_PLAYWRIGHT_PACKAGE: /tmp/ncc-entry-sdk/package.json
        run: node efg-nutrition/tests/self-management-entry-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-self-entry-preview
          path: artifacts/ncc-self-entry/
