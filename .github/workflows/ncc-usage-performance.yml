name: NCC focused usage and performance
on:
  push:
    branches: [work/ncc-usage-performance-20261113]
    paths:
      - 'efg-nutrition/tests/usage-performance*'
      - '.github/workflows/ncc-usage-performance.yml'
permissions:
  contents: read
jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Complete WebKit mobile samples; retain four completed profiles from run 43434184360
        env:
          NCC_USAGE_ENGINES: webkit
          NCC_USAGE_WIDTHS: '390,320'
        run: node efg-nutrition/tests/usage-performance-browser.mjs
      - name: Public anonymous opening, fresh contexts and reloads
        if: always()
        shell: bash
        run: |
          if ! git -c safe.directory="$GITHUB_WORKSPACE" diff --quiet HEAD^ HEAD -- efg-nutrition/tests/usage-performance-public.mjs; then
            node efg-nutrition/tests/usage-performance-public.mjs
          else
            echo "Reuse unchanged public measurement from run 43431789344; product and public script unchanged."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncc-usage-performance
          path: artifacts/usage-performance/
          if-no-files-found: error
          retention-days: 7
