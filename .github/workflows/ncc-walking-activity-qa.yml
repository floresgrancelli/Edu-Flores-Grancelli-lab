name: NCC Walking Activity V2 QA (isolated)

on:
  push:
    branches: [feature/ncc-walking-activity-20261102]
    paths:
      - 'efg-nutrition/pilot/walking-*'
      - 'efg-nutrition/pilot/pilot.js'
      - 'efg-nutrition/pilot/index.html'
      - 'efg-nutrition/tests/sport-step-walking-estimator.mjs'
      - 'efg-nutrition/docs/NCC_WALKING_V2_STAGING_ONLY.sql'
      - '.github/workflows/ncc-walking-activity-qa.yml'
  pull_request:
    branches: [release/ncc-pilot-fast-track-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walking-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_qa_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_qa_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Execute additive migration against disposable PG17 and preserve legacy rows/policies
        run: |
          node --check efg-nutrition/tests/walking-v2-postgres17.mjs
          node efg-nutrition/tests/walking-v2-postgres17.mjs
  walking-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check efg-nutrition/pilot/walking-steps-estimator.js
          node --check efg-nutrition/pilot/walking-activity-ui.js
          node --check efg-nutrition/pilot/pilot.js
          node --check efg-nutrition/tests/sport-step-walking-estimator.mjs
      - run: node efg-nutrition/tests/sport-step-walking-estimator.mjs
